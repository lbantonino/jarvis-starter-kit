name: synode-demo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Définis ODOO_DB_PASSWORD dans .env}
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:19.0-20261112
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Définis ODOO_DB_PASSWORD dans .env}
    ports:
      - '127.0.0.1:8069:8069'
    volumes:
      - odoo-data:/var/lib/odoo
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

  n8n-db:
    image: postgres:17
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Définis N8N_DB_PASSWORD dans .env}
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.5
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Définis N8N_DB_PASSWORD dans .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Définis N8N_ENCRYPTION_KEY dans .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      GENERIC_TIMEZONE: Europe/Brussels
      TZ: Europe/Brussels
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
  n8n-db:
  n8n-data:
